<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
      content="width=device-width, 
               initial-scale=1.0, 
               maximum-scale=1.0, 
               user-scalable=no">
    <title>Alhambra-WEBTools</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Panel de Error: Navegador NO SOPORTADO -->
    <div id="no-support" class="error-panel hidden">
        <div class="error-icon">⚠️</div>
        <h2>Navegador no compatible</h2>
        <p>Esta aplicación requiere <strong>WebUSB</strong> para comunicarse 
           con la Alhambra-II. Utiliza Chrome u otro navegador 
           basado en Chromium.</p>
    </div>

    <!-- PANEL PRINCIPAL (transparente) -->
    <div id="main-app" class="glass-container">

        <!-- Título del panel -->
        <header>
            <h1>Alhambra-II <span>WEBTools</span></h1>
        </header>

        <!-- Cuerpo del panel -->
        <main>
            <div id="status-card" class="status-card">
                <div class="indicator"></div>
                <div class="info">
                    <p id="status-text">Buscando dispositivo...</p>
                    <h2 id="device-name">Placa no conectada</h2>
                </div>
            </div>

            <div id="actions-area" class="actions-area">
                <button id="connect-btn" class="primary-btn">Conectar</button>
                <button id="reset-btn" class="primary-btn hidden">Reset FPGA</button>
                <button id="flash-id-btn" class="primary-btn hidden" style="background: #a855f7;">
                    Identificar Flash
                </button>
                <button id="disconnect-btn" class="secondary-btn danger hidden">
                    ✕ Desconectar
                </button>
            </div>

            <div class="console-section">
                <div class="console-header">
                    <button id="toggle-log" class="toggle-btn">
                        <span>Ver Log de Sistema</span>
                        <svg class="chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    
                    <button id="clear-log" class="icon-btn" title="Limpiar consola">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                
                <div id="console-wrapper" class="console-wrapper">
                    <div id="console-log" class="console-log"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script MAIN -->
    <script type="module" src="app.js"></script>
</body>
</html>
