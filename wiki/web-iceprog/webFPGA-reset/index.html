<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
      content="width=device-width, 
               initial-scale=1.0, 
               maximum-scale=1.0, 
               user-scalable=no">
    <title>Alhambra-WEBTools</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Panel de Error: Navegador NO SOPORTADO -->
    <div id="no-support" class="error-panel hidden">
        <div class="error-icon">⚠️</div>
        <h2>Navegador no compatible</h2>
        <p>Esta aplicación requiere <strong>WebUSB</strong> para comunicarse 
           con la Alhambra-II. Utiliza Chrome u otro navegador 
           basado en Chromium.</p>
    </div>

    <!-- PANEL PRINCIPAL (transparente) -->
    <div id="main-app" class="glass-container">

        <!-- Título del panel -->
        <header>
            <h1>Alhambra-II <span>WEBTools</span></h1>
        </header>

        <!-- Cuerpo del panel -->
        <main>
            <div id="status-card" class="status-card">
                <div class="indicator"></div>
                <div class="info">
                    <p id="status-text">Buscando dispositivo...</p>
                    <h2 id="device-name">Placa no conectada</h2>
                </div>
            </div>

            <!-- Botón de conectar PLACA -->
            <button id="connect-btn" class="primary-btn">Conectar</button>


            <div id="actions-area" class="actions"></div>
        </main>

    </div>

    <!-- Script MAIN -->
    <script type="module" src="app.js"></script>
</body>
</html>
